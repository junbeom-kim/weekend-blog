# 매주 목요일 저녁(한국시간 19:47)에 이번 주말 글을 만들어 저장소에 커밋
# 검수 모드: 배포는 하지 않는다. 글을 확인하고 프롬프트가 안정되면
# upload-pages-artifact 단계와 deploy 잡, pages/id-token 권한을 되살려 자동 배포로 전환한다.
name: weekly-post

on:
  schedule:
    - cron: "47 10 * * 4"   # UTC 기준. 10:47 UTC = 19:47 KST
  workflow_dispatch:         # Actions 탭에서 수동 실행 버튼

# 수동 실행과 예약 실행이 겹치면 git push 가 충돌하므로 한 번에 하나만 돌린다
concurrency:
  group: weekly-post
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt

      - name: 1. 행사 수집
        env:
          TOURAPI_SERVICE_KEY: ${{ secrets.TOURAPI_SERVICE_KEY }}
        run: python -m scripts.fetch_events

      - name: 2. 글 작성
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python -m scripts.write_post

      - name: 3. 사이트 빌드 (렌더링 확인용, 배포 안 함)
        run: python -m scripts.build_site

      - name: 데이터와 글을 저장소에 기록
        run: |
          git config user.name "weekend-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data posts
          git commit -m "weekly post $(date +%F)" || echo "변경 없음"
          git push

